<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditFlux ワンクリック編集</title>
    <style>
        :root {
            --bg-0: #0b1218;
            --bg-1: #121c25;
            --panel: rgba(20, 31, 41, 0.86);
            --panel-border: rgba(129, 170, 197, 0.18);
            --text-0: #f4f8fb;
            --text-1: #9cb2c3;
            --text-2: #6e8393;
            --accent: #5fd3ff;
            --accent-strong: #11aef0;
            --success: #61e8a6;
            --warn: #ffd76b;
            --error: #ff7b7b;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: "Hiragino Sans", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text-0);
            padding: 14px;
            background: linear-gradient(165deg, var(--bg-0), var(--bg-1));
        }
        h1 { font-size: 16px; margin: 0 0 4px; }
        .sub { font-size: 11px; color: var(--text-2); margin-bottom: 14px; }
        .panel {
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--panel);
        }
        .status-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--error); flex: 0 0 auto; }
        .dot.ok { background: var(--success); }
        button {
            width: 100%;
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #081119;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.secondary { background: rgba(255,255,255,0.08); color: var(--text-0); }
        input[type="file"] { display: none; }
        .file-label {
            display: block;
            font-size: 11px;
            color: var(--text-2);
            margin-bottom: 8px;
            word-break: break-all;
        }
        .opts { display: flex; gap: 6px; margin-bottom: 8px; }
        .opts select {
            flex: 1;
            background: rgba(9,17,25,0.72);
            color: var(--text-0);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px;
            font-size: 11px;
        }
        .log {
            max-height: 180px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
        }
        .log .entry { margin-bottom: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(15,24,33,0.5); }
        .log .entry.error { color: #ffadad; border-left: 3px solid var(--error); }
        .log .entry.ok { color: #bdf3d6; border-left: 3px solid var(--success); }
        .log .entry.info { border-left: 3px solid var(--accent); color: var(--text-1); }
        .style-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }
        .style-tile {
            border-radius: 8px;
            overflow: hidden;
            background: rgba(9,17,25,0.6);
            border: 1px solid var(--panel-border, rgba(129,170,197,0.18));
        }
        .style-tile img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #000;
        }
        .style-tile .style-label {
            font-size: 9px;
            color: var(--text-1);
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .style-empty { font-size: 11px; color: var(--text-2); grid-column: 1 / -1; }
        .steps {
            display: flex;
            overflow-x: auto;
            gap: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }
        .step-tab {
            flex: 0 0 auto;
            padding: 8px 10px;
            font-size: 11px;
            color: var(--text-2);
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .step-tab.active { color: var(--text-0); border-bottom-color: var(--accent); }
        .step-tab.disabled { color: var(--text-2); opacity: 0.5; cursor: default; }
        .step-content { display: none; }
        .step-content.active { display: block; }
        .coming-soon {
            font-size: 12px;
            color: var(--text-2);
            text-align: center;
            padding: 24px 8px;
        }
    </style>
</head>
<body>
    <h1>EditFlux ワンクリック編集</h1>
    <div class="sub">Premiere自動化パネル &middot; v0.1</div>

    <section class="panel">
        <div class="status-row">
            <div class="dot" id="bridgeDot"></div>
            <span id="bridgeText">Premiere Bridge: 確認中…</span>
        </div>
        <div class="status-row">
            <div class="dot" id="serverDot"></div>
            <span id="serverText">自動化サーバー: 確認中…</span>
        </div>
        <button class="secondary" onclick="startServer()" id="startServerBtn">自動化サーバーを起動</button>
    </section>

    <section class="panel">
        <div class="steps">
            <div class="step-tab active" data-step="1" onclick="showStep(1)">① ジャンプカット</div>
            <div class="step-tab" data-step="2" onclick="showStep(2)">② テロップ生成</div>
            <div class="step-tab disabled" data-step="3" onclick="showStep(3)">③ BGM</div>
            <div class="step-tab disabled" data-step="4" onclick="showStep(4)">④ トークテーマ</div>
        </div>

        <div class="step-content active" data-step="1">
            <button onclick="runJumpCut()" id="jumpCutBtn">ジャンプカットを実行</button>
            <div class="opts">
                <select id="jumpCutPreset">
                    <option value="interview" selected>インタビュー・対談動画(0.5秒以上→0.2秒残す)</option>
                    <option value="presentation">プレゼン・解説動画(0.3秒以上→0.1秒に短縮)</option>
                    <option value="vlog">Vlog・日常系動画(1.0秒以上→0.3秒に詰める)</option>
                </select>
            </div>
        </div>

        <div class="step-content" data-step="2">
            <div class="coming-soon">現在製作中です。</div>
        </div>

        <div class="step-content" data-step="3">
            <div class="coming-soon">準備中です。<br>BGMを動画の尺に自動フィットする機能は今後追加予定です。</div>
        </div>

        <div class="step-content" data-step="4">
            <div class="coming-soon">準備中です。<br>話している内容から見出しを自動生成する機能は今後追加予定です。</div>
        </div>
    </section>

    <section class="panel">
        <input type="file" id="mediaFile" accept="video/*,image/*,audio/*" onchange="onFileChosen()">
        <button onclick="document.getElementById('mediaFile').click()">メディアを選んで挿入</button>
        <div class="file-label" id="fileLabel">(未選択)</div>
    </section>

    <section class="panel">
        <div class="log" id="logContainer"></div>
    </section>

    <script src="CSInterface.js"></script>
    <script src="panel.js"></script>
</body>
</html>
